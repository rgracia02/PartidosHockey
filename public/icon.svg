<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Hockey Stick & Ball Silhouette -->
  <g filter="url(#shadow)" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Stick 1 -->
    <path d="M 170 110 L 300 340 C 315 365, 345 385, 375 375 C 400 365, 410 335, 395 315" />
    <!-- Ball -->
    <circle cx="210" cy="380" r="26" fill="#fbbf24" stroke="#ffffff" stroke-width="12" />
  </g>
</svg>
